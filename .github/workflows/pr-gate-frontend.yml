name: PR Gate (Frontend)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - development
      - staging
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  branch-flow-check:
    name: branch-flow-check
    runs-on: ubuntu-latest

    steps:
      - name: Validate allowed promotion path
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          echo "PR source branch: $HEAD_REF"
          echo "PR target branch: $BASE_REF"

          allowed=false

          # Any feature/fix/chore/etc branch -> development
          if [[ "$BASE_REF" == "development" ]]; then
            allowed=true
          fi

          # Only development -> staging
          if [[ "$BASE_REF" == "staging" && "$HEAD_REF" == "development" ]]; then
            allowed=true
          fi

          # Only staging -> main
          if [[ "$BASE_REF" == "main" && "$HEAD_REF" == "staging" ]]; then
            allowed=true
          fi

          if [[ "$allowed" != "true" ]]; then
            echo "Invalid PR flow: $HEAD_REF -> $BASE_REF"
            echo "Allowed flows are:"
            echo "  * any working branch -> development"
            echo "  * development -> staging"
            echo "  * staging -> main"
            exit 1
          fi

          echo "Branch flow is valid."

  ci-checks:
    name: ci-checks
    runs-on: ubuntu-latest
    needs: branch-flow-check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"  

      - name: Install dependencies
        run: |
          npm ci || npm install

      - name: Lint
        run: |
          npm run lint --if-present

      - name: Type Check (if TS)
        run: |
          npm run type-check --if-present

      - name: Build
        run: |
          npm run build
